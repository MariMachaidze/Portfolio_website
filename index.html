  <body>
    <!--
      Static stub so Netlify's build-time form detection can find this form —
      it only scans the built HTML, not the JS-rendered app. The real form
      (src/components/sections/Contact.tsx) submits to this same form name
      via fetch. Field names here must match the real form's `name`
      attributes exactly.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
